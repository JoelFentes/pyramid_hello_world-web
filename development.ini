[app:main]
use = egg:pyramid_hello_world
reload_templates = true
debug_authorization = false
debug_notfound = false
debug_routematch = false
pyramid.reload_templates = true
pyramid.debug_all = true


[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6543

[loggers]
keys = root, pyramid

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid]
level = DEBUG
handlers =
qualname = pyramid

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s][%(threadName)s] %(message)s